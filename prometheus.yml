global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'dtoe-master'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['master:8080']

  - job_name: 'dtoe-scheduler'
    static_configs:
      - targets: ['scheduler:8081']

  - job_name: 'dtoe-worker'
    static_configs:
      - targets: ['worker:8082']